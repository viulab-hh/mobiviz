<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>MapLibre 2D/2.5D Transition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Fonts -->
    <!-- <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: black;
            margin: 0;
            /* font-family: 'Plus Jakarta Sans', sans-serif; */
            font-family: 'IBM Plex Sans', sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .buttons-tl,
        #param-form {
            position: absolute;
            left: 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .buttons-tl {
            top: 20px;
        }

        #param-form {
            bottom: 20px;
            /* background: white; */
            padding: 16px 32px 24px;
            border-radius: 8px;
            font-size: 18px;
        }

        button {
            padding: 12px 16px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 20px;
            border: none;
            color: #333;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button,
        #param-form,
        .maplibregl-ctrl {
            color: white;
            backdrop-filter: blur(24px);
            background: rgba(20, 20, 25, 0.4);
        }

        .mapboxgl-ctrl-top-right .mapboxgl-ctrl,
        .mapboxgl-ctrl-top-left .mapboxgl-ctrl {
            margin: 20px;
        }

        .mapboxgl-ctrl-bottom-left .mapboxgl-ctrl,
        .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl {
            margin: 0;
        }

        .mapboxgl-ctrl-group button+button {
            border-top: 0px;
            color: #fff !important;
        }

        button.mapboxgl-ctrl-zoom-in span.maplibregl-ctrl-icon {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='29' height='29' viewBox='0 0 29 29' xmlns='http://www.w3.org/2000/svg' fill='%23fff'%3E%3Cpath d='M14.5 8.5c-.75 0-1.5.75-1.5 1.5v3h-3c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h3v3c0 .75.75 1.5 1.5 1.5S16 19.75 16 19v-3h3c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-3v-3c0-.75-.75-1.5-1.5-1.5z'/%3E%3C/svg%3E") !important;
        }

        button.mapboxgl-ctrl-zoom-out span.maplibregl-ctrl-icon {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='29' height='29' viewBox='0 0 29 29' xmlns='http://www.w3.org/2000/svg' fill='%23fff'%3E%3Cpath d='M10 13c-.75 0-1.5.75-1.5 1.5S9.25 16 10 16h9c.75 0 1.5-.75 1.5-1.5S19.75 13 19 13h-9z'/%3E%3C/svg%3E") !important;
        }

        button.mapboxgl-ctrl-compass span.maplibregl-ctrl-icon {
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='29' height='29' viewBox='0 0 29 29' xmlns='http://www.w3.org/2000/svg' fill='%23da5550'%3E%3Cpath d='m10.5 14 4-8 4 8h-8z'/%3E%3Cpath d='m10.5 16 4 8 4-8h-8z' fill='%23ddd'/%3E%3C/svg%3E") !important;
        }

        label {
            display: block;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section-title i {
            font-size: 14px;
            opacity: 0.8;
        }

        .tab-bar {
            display: flex;
            background: rgba(40, 40, 45, 0.6);
            border-radius: 6px;
            padding: 4px;
            gap: 4px;
        }

        .tab-button {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            font-family: 'IBM Plex Sans', sans-serif;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        .tab-button.active {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-weight: 500;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 2px 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: rgba(255, 255, 255, 0.8);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .switch-label {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }

        .switch-caption {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            /* font-style: italic; */
        }

        p {
            margin-block: 4px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 16px;
            border: none;
            color: white;
            background: rgba(40, 40, 45, 0.8);
            cursor: pointer;
            border-radius: 6px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='white'%3E%3Cpath d='M8 11L3 6h10z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 36px;
        }

        select:focus {
            outline: 2px solid rgba(255, 255, 255, 0.5);
            outline-offset: 2px;
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .maplibregl-ctrl-group button {
            width: 36px !important;
            height: 36px !important;
        }

        #legend-container {
            position: absolute;
            right: 20px;
            bottom: 24px;
            z-index: 1;
            color: white;
            font-size: 12px;
        }

        .legend-title {
            text-align: center;
            font-size: 12px;
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .legend-bar {
            display: flex;
            height: 8px;
            width: 300px;
            position: relative;
        }

        .legend-segment {
            flex: 1;
        }

        .legend-segment:first-child {
            border-radius: 4px 0 0 4px;
        }

        .legend-segment:last-child {
            border-radius: 0 4px 4px 0;
        }

        .legend-labels {
            position: relative;
            height: 20px;
            margin-top: 4px;
        }

        .legend-label {
            position: absolute;
            font-size: 11px;
            color: white;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        .legend-label.left-aligned {
            transform: translateX(0);
        }

        .legend-label.right-aligned {
            transform: translateX(-100%);
        }
    </style>
</head>

<body>
    <div class="buttons-tl">
        <button id="pitchButton" onclick="pitchButtonPressed()">3D</button>
    </div>

    <div id="legend-container">
        <div class="legend-title">Erreichbarkeit</div>
        <div id="legend-content"></div>
    </div>

    <div id="param-form">
        <form id="paramForm">
            <div class="form-container">
                <div class="form-section">
                    <h3 class="form-section-title"><i class="fas fa-map-marker-alt"></i> Ort</h3>
                    <div class="tab-bar" data-group="data">
                        <button type="button" class="tab-button" data-value="h">Hamburg</button>
                        <button type="button" class="tab-button" data-value="l">Lüchow</button>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="form-section-title"><i class="fas fa-user-doctor"></i> Fachrichtung</h3>
                    <select id="specialtySelect">
                        <option value="hausaerzteErwachsene">Hausärzte (Erwachsene)</option>
                        <option value="hausaerzteKinder">Hausärzte (Kinder)</option>
                        <option value="anaesthesie">Anästhesie</option>
                        <option value="augenaerzte">Augenärzte</option>
                        <option value="chirurgie">Chirurgie</option>
                        <option value="fachaerztlicheKindermedizin">Fachärztliche Kindermedizin</option>
                        <option value="frauenheilkunde">Frauenheilkunde</option>
                        <option value="hautaerzte">Hautärzte</option>
                        <option value="hnoaerzte">HNO-Ärzte</option>
                        <option value="innereMedizin">Innere Medizin</option>
                        <option value="laborMedizin">Labormedizin</option>
                        <option value="neurologiePsychiatrie">Neurologie/Psychiatrie</option>
                        <option value="pathologie">Pathologie</option>
                        <option value="radiologie">Radiologie</option>
                        <option value="sonderfaecher">Sonderfächer</option>
                        <option value="sonstige">Sonstige</option>
                        <option value="strahlentherapieNuklearmedizin">Strahlentherapie/Nuklearmedizin</option>
                        <option value="urologen">Urologen</option>
                    </select>
                </div>
                <div class="form-section">
                    <h3 class="form-section-title"><i class="fas fa-chart-simple"></i> Erreichbarkeitswerte</h3>
                    <div class="tab-bar" data-group="values">
                        <button type="button" class="tab-button" data-value="nowNom">Mittelwerte</button>
                        <button type="button" class="tab-button" data-value="nowMinMax">Minima/Maxima</button>
                    </div>
                </div>
                <div class="form-section">
                    <h3 class="form-section-title"><i class="fas fa-arrow-trend-up"></i> Zukunftsszenario</h3>
                    <div class="tab-bar" data-group="prognosis">
                        <button type="button" class="tab-button" data-value="off">Off</button>
                        <button type="button" class="tab-button" data-value="progNom10">-10%</button>
                        <button type="button" class="tab-button" data-value="progNom20">-20%</button>
                    </div>
                </div>
                <div class="form-section">
                    <div class="switch-container">
                        <span class="switch-label"><i class="fas fa-users-viewfinder"></i> Gewichtet nach
                            Bevölkerung</span>
                        <label class="switch">
                            <input type="checkbox" id="weightedSwitch">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="switch-caption" id="weightedCaption">Zeit in Minuten</div>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Set active tabs immediately to prevent flicker
        (function () {
            const params = new URLSearchParams(window.location.search);

            // Map mode to values and prognosis tabs
            function mapModeToTabs(mode) {
                const values = {
                    'nowNom': 'nowNom',
                    'nowMinMax': 'nowMinMax',
                    'progNom10': 'nowNom', // Prognosis forces Average
                    'progNom20': 'nowNom'  // Prognosis forces Average
                };

                const prognosis = {
                    'nowNom': 'off',
                    'nowMinMax': 'off',
                    'progNom10': 'progNom10',
                    'progNom20': 'progNom20'
                };

                return {
                    values: values[mode] || 'nowNom',
                    prognosis: prognosis[mode] || 'off'
                };
            }

            // Set active state as soon as possible
            function setActiveTabs() {
                const currentData = params.get('data') || 'h'; // default to 'h'
                const currentMode = params.get('mode') || 'nowNom'; // default to 'nowNom'
                const currentWeighted = params.get('weighted') === 'true'; // default to false
                const currentSpecialty = params.get('specialty') || 'hausaerzteErwachsene'; // default specialty
                const tabMapping = mapModeToTabs(currentMode);

                // Set data tab active
                const dataTab = document.querySelector(`.tab-bar[data-group="data"] .tab-button[data-value="${currentData}"]`);
                if (dataTab) {
                    document.querySelectorAll('.tab-bar[data-group="data"] .tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    dataTab.classList.add('active');
                }

                // Set specialty select
                const specialtySelect = document.getElementById('specialtySelect');
                if (specialtySelect) {
                    specialtySelect.value = currentSpecialty;
                }

                // Update specialty options based on current location (must be called after DOM is ready)
                if (typeof updateSpecialtyOptions === 'function') {
                    updateSpecialtyOptions(currentData);
                }

                // Set weighted switch
                const weightedSwitch = document.getElementById('weightedSwitch');
                if (weightedSwitch) {
                    weightedSwitch.checked = currentWeighted;
                    if (typeof updateWeightedCaption === 'function') {
                        updateWeightedCaption(currentWeighted);
                    }
                }

                // Set values tab active
                const valuesTab = document.querySelector(`.tab-bar[data-group="values"] .tab-button[data-value="${tabMapping.values}"]`);
                if (valuesTab) {
                    document.querySelectorAll('.tab-bar[data-group="values"] .tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    valuesTab.classList.add('active');
                }

                // Set prognosis tab active
                const prognosisTab = document.querySelector(`.tab-bar[data-group="prognosis"] .tab-button[data-value="${tabMapping.prognosis}"]`);
                if (prognosisTab) {
                    document.querySelectorAll('.tab-bar[data-group="prognosis"] .tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    prognosisTab.classList.add('active');
                }
            }


            // Try to set immediately if DOM is ready, otherwise wait
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    setActiveTabs();
                    if (typeof updateLegend === 'function') {
                        updateLegend();
                    }
                });
            } else {
                setActiveTabs();
                if (typeof updateLegend === 'function') {
                    updateLegend();
                }
            }
        })();

        // Global function for updating specialty options
        function updateSpecialtyOptions(location) {
            const specialtySelect = document.getElementById('specialtySelect');
            if (!specialtySelect) return;

            // Specialties only available in Hamburg
            const hamburgOnlySpecialties = [
                'fachaerztlicheKindermedizin',
                'laborMedizin',
                'pathologie',
                'sonderfaecher',
                'strahlentherapieNuklearmedizin'
            ];

            const options = specialtySelect.querySelectorAll('option');
            const currentValue = specialtySelect.value;
            
            options.forEach(option => {
                const isHamburgOnly = hamburgOnlySpecialties.includes(option.value);
                
                if (location === 'l' && isHamburgOnly) {
                    option.disabled = true;
                    option.textContent = option.textContent.split(' (')[0] + ' (nur Hamburg)';
                } else {
                    option.disabled = false;
                    // Remove " (nur Hamburg)" suffix if it exists
                    option.textContent = option.textContent.replace(' (nur Hamburg)', '');
                }
            });

            // If current selection is Hamburg-only and we switched to Lüchow, reset to default
            if (location === 'l' && hamburgOnlySpecialties.includes(currentValue)) {
                specialtySelect.value = 'hausaerzteErwachsene';
                
                // Update URL
                const url = new URL(window.location.href);
                url.searchParams.set('specialty', 'hausaerzteErwachsene');
                window.history.replaceState({}, '', url.toString());
            }
        }

        // JavaScript for tab bar interactions
        document.addEventListener('DOMContentLoaded', function () {
            // Handle specialty select
            const specialtySelect = document.getElementById('specialtySelect');
            if (specialtySelect) {
                specialtySelect.addEventListener('change', function () {
                    // Update URL without reload
                    const url = new URL(window.location.href);
                    url.searchParams.set('specialty', this.value);
                    window.history.replaceState({}, '', url.toString());

                    // Update map data
                    updateMapData();
                });
            }

            // Handle weighted switch
            const weightedSwitch = document.getElementById('weightedSwitch');
            if (weightedSwitch) {
                weightedSwitch.addEventListener('change', function () {
                    updateWeightedCaption(this.checked);

                    // Update URL without reload
                    const url = new URL(window.location.href);
                    url.searchParams.set('weighted', this.checked.toString());
                    window.history.replaceState({}, '', url.toString());

                    // Update map data
                    updateMapData();
                });
            }

            // Handle tab button clicks
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', function () {
                    const group = this.closest('.tab-bar').dataset.group;
                    const value = this.dataset.value;

                    // Remove active class from all buttons in the same group
                    this.closest('.tab-bar').querySelectorAll('.tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });

                    // Add active class to clicked button
                    this.classList.add('active');

                    // Handle constraints and force-switches
                    if (group === 'prognosis') {
                        if (value === 'progNom10' || value === 'progNom20') {
                            // Prognosis active: force values to "Average"
                            forceValuesToAverage();
                        }
                    } else if (group === 'values') {
                        if (value === 'nowMinMax') {
                            // Min/Max selected: force prognosis to "Off"
                            forcePrognosisOff();
                        }
                    }

                    // Update URL without reload
                    const url = new URL(window.location.href);

                    if (group === 'data') {
                        // Direct mapping for data
                        url.searchParams.set('data', value);
                        window.history.replaceState({}, '', url.toString());

                        // Update specialty dropdown based on location
                        updateSpecialtyOptions(value);

                        // Animate camera to new location
                        animateToLocation(value);
                    } else if (group === 'values' || group === 'prognosis') {
                        // Get final combined mode
                        const mode = getCombinedMode();
                        url.searchParams.set('mode', mode);
                        window.history.replaceState({}, '', url.toString());

                        // Update map data
                        updateMapData();
                    }
                });
            });

            // Helper functions
            function forceValuesToAverage() {
                const averageTab = document.querySelector('.tab-bar[data-group="values"] .tab-button[data-value="nowNom"]');
                if (averageTab) {
                    document.querySelectorAll('.tab-bar[data-group="values"] .tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    averageTab.classList.add('active');
                }
            }

            function forcePrognosisOff() {
                const offTab = document.querySelector('.tab-bar[data-group="prognosis"] .tab-button[data-value="off"]');
                if (offTab) {
                    document.querySelectorAll('.tab-bar[data-group="prognosis"] .tab-button').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    offTab.classList.add('active');
                }
            }

            function getCombinedMode() {
                const currentValues = getCurrentValues();
                const currentPrognosis = getCurrentPrognosis();

                // Apply constraints
                if (currentPrognosis === 'progNom10' || currentPrognosis === 'progNom20') {
                    return currentPrognosis; // Prognosis overrides values
                } else if (currentValues === 'nowMinMax') {
                    return 'nowMinMax'; // Min/Max forces prognosis off
                } else {
                    return currentValues; // Default to values
                }
            }

            function getCurrentValues() {
                const activeValuesTab = document.querySelector('.tab-bar[data-group="values"] .tab-button.active');
                return activeValuesTab ? activeValuesTab.dataset.value : 'nowNom';
            }

            function getCurrentPrognosis() {
                const activePrognosisTab = document.querySelector('.tab-bar[data-group="prognosis"] .tab-button.active');
                return activePrognosisTab ? activePrognosisTab.dataset.value : 'off';
            }

            // Function to animate camera to new location
            function animateToLocation(dataValue) {
                const center = dataValue === 'h' ? [10, 53.54] : [11.15, 53.05];
                map.flyTo({
                    center: center,
                    zoom: 10,
                    duration: 1500,
                    essential: true
                });

                // Update map data after camera animation
                setTimeout(() => {
                    updateMapData();
                }, 1600);
            }

            // Function to update map data without reload
            function updateMapData() {
                // Get current parameters
                const currentData = getCurrentData();
                const currentMode = getCombinedMode();
                const currentWeighted = document.getElementById('weightedSwitch').checked;
                const currentSpecialty = getCurrentSpecialty();

                // Update global variables
                window.dataParam = currentData;
                window.mode = currentMode;
                window.weighted = currentWeighted;
                window.specialty = currentSpecialty;
                window.prognosis = window.mode == 'progNom10' || window.mode == 'progNom20';

                // Update legend
                updateLegend();

                // Update data path
                const dataPath = window.dataParam == 'h' ?
                    `data/20250924-hamburg/${currentSpecialty}.geojson` :
                    `data/20250919-luechow/${currentSpecialty}.geojson`;

                // Load and process new data
                fetch(dataPath)
                    .then(res => res.json())
                    .then(geojson => {
                        processAndUpdateMapData(geojson);
                    })
                    .catch(error => {
                        console.error('Error loading data:', error);
                    });
            }

            function getCurrentData() {
                const activeDataTab = document.querySelector('.tab-bar[data-group="data"] .tab-button.active');
                return activeDataTab ? activeDataTab.dataset.value : 'h';
            }

            function getCurrentSpecialty() {
                const specialtySelect = document.getElementById('specialtySelect');
                return specialtySelect ? specialtySelect.value : 'hausaerzteErwachsene';
            }

        });
    </script>

    <div id="map"></div>

    <script src="tokens.js"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script>
        // SEARCH PARAMS
        const searchParams = new URLSearchParams(window.location.search);

        window.mode = (searchParams.get('mode') || 'nowNom');
        console.log("mode: ", window.mode);
        window.dataParam = (searchParams.get('data') || 'h');
        window.weighted = (searchParams.get('weighted') === 'true');
        window.specialty = (searchParams.get('specialty') || 'hausaerzteErwachsene');

        window.prognosis = window.mode == 'progNom10' || window.mode == 'progNom20';

        // Global function for updating weighted caption
        function updateWeightedCaption(isWeighted) {
            const caption = document.getElementById('weightedCaption');
            if (caption) {
                caption.textContent = isWeighted ? 'Zeit in Minuten, gewichtet nach Bevölkerung' : 'Zeit in Minuten';
            }
        }

        // Global function for updating legend
        function updateLegend() {
            const legendContent = document.getElementById('legend-content');
            if (!legendContent) return;

            const prettyBreaks = window.dataParam == 'h' ? [2, 4, 6] : [5, 10, 15];
            const colorMin = [50, 165, 202]; // Blue
            const colorMax = [218, 85, 80];  // Red
            
            if (window.prognosis) {
                // Prognosis mode: 3 blue + 1 white + 3 red = 7 segments
                const numSegments = 7;
                let segments = '';
                let labels = '';
                
                for (let i = 0; i < numSegments; i++) {
                    let color;
                    if (i < 3) {
                        // Blue segments (0, 1, 2): go from dark blue to 2/3 of the way to white
                        const t = i / 3; // 0, 0.33, 0.67
                        const r = Math.round((1 - t) * colorMin[0] + t * 255);
                        const g = Math.round((1 - t) * colorMin[1] + t * 255);
                        const b = Math.round((1 - t) * colorMin[2] + t * 255);
                        color = `rgb(${r}, ${g}, ${b})`;
                    } else if (i === 3) {
                        // White segment in the middle
                        color = 'rgb(255, 255, 255)';
                    } else {
                        // Red segments (4, 5, 6): start 1/3 of the way from white, go to dark red
                        const t = (i - 3) / 3; // 0.33, 0.67, 1.0
                        const r = Math.round((1 - t) * 255 + t * colorMax[0]);
                        const g = Math.round((1 - t) * 255 + t * colorMax[1]);
                        const b = Math.round((1 - t) * 255 + t * colorMax[2]);
                        color = `rgb(${r}, ${g}, ${b})`;
                    }
                    segments += `<div class="legend-segment" style="background: ${color};"></div>`;
                }
                
                // Labels: niedriger (left), gleich (center), höher (right)
                labels = `
                    <div class="legend-label left-aligned" style="left: 0;">niedriger</div>
                    <div class="legend-label" style="left: 50%;">gleich</div>
                    <div class="legend-label right-aligned" style="left: 100%;">höher</div>
                `;
                
                legendContent.innerHTML = `
                    <div class="legend-bar">${segments}</div>
                    <div class="legend-labels">${labels}</div>
                `;
            } else if (window.weighted) {
                // Weighted non-prognosis: discrete segments from blue to red
                const numSegments = 4;
                let segments = '';
                
                for (let i = 0; i < numSegments; i++) {
                    const t = i / (numSegments - 1);
                    const r = Math.round((1 - t) * colorMin[0] + t * colorMax[0]);
                    const g = Math.round((1 - t) * colorMin[1] + t * colorMax[1]);
                    const b = Math.round((1 - t) * colorMin[2] + t * colorMax[2]);
                    const color = `rgb(${r}, ${g}, ${b})`;
                    segments += `<div class="legend-segment" style="background: ${color};"></div>`;
                }
                
                // Labels: niedrig (left), hoch (right)
                const labels = `
                    <div class="legend-label left-aligned" style="left: 0;">niedrig</div>
                    <div class="legend-label right-aligned" style="left: 100%;">hoch</div>
                `;
                
                legendContent.innerHTML = `
                    <div class="legend-bar">${segments}</div>
                    <div class="legend-labels">${labels}</div>
                `;
            } else {
                // Unweighted: discrete segments with break labels
                const numSegments = prettyBreaks.length + 1;
                let segments = '';
                let labels = '';
                
                for (let i = 0; i < numSegments; i++) {
                    const t = i / prettyBreaks.length;
                    const r = Math.round((1 - t) * colorMin[0] + t * colorMax[0]);
                    const g = Math.round((1 - t) * colorMin[1] + t * colorMax[1]);
                    const b = Math.round((1 - t) * colorMin[2] + t * colorMax[2]);
                    const color = `rgb(${r}, ${g}, ${b})`;
                    segments += `<div class="legend-segment" style="background: ${color};"></div>`;
                }
                
                // Labels at breaks between segments
                for (let i = 0; i < prettyBreaks.length; i++) {
                    const position = ((i + 1) / numSegments) * 100;
                    labels += `<div class="legend-label" style="left: ${position}%;">${prettyBreaks[i]} min</div>`;
                }
                
                legendContent.innerHTML = `
                    <div class="legend-bar">${segments}</div>
                    <div class="legend-labels">${labels}</div>
                `;
            }
        }

        const dataPath = window.dataParam == 'h' ?
            `data/20250924-hamburg/${window.specialty}.geojson` :
            `data/20250919-luechow/${window.specialty}.geojson`;

        const binCount = parseInt(searchParams.get('bins')) || 4;

        // SEARCH PARAMS

        const prettyBreaks = window.dataParam == 'h' ? [2, 4, 6] : [5, 10, 15];

        const verticesCountNow = 12;
        const verticesCountPrognosis = 4;
        const center = window.dataParam === 'h' ? [10, 53.54] : [11.15, 53.05];
        const radiusInMeters = 50;
        const earthRadius = 6371000;

        // let extrusionFactor = 1;
        // if (mode === 'nowNom' || mode === 'nowMinMax')
        const extrusionFactor = window.weighted ? 8000 : 3200;

        const latRadiusInDegrees = radiusInMeters / earthRadius * (180 / Math.PI);
        const lonRadiusInDegrees = radiusInMeters / (earthRadius * Math.cos(center[1] * Math.PI / 180)) * (180 / Math.PI);

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://api.maptiler.com/maps/basic-v2-dark/style.json?key=' + MAPTILER_KEY,
            center: center,
            zoom: 10,
            pitch: 0,
            bearing: 0
        });

        const MapState = { in2D: 1, in3D: 2, animating: 4 };
        let mapState = MapState.in2D;

        let nav = new maplibregl.NavigationControl();
        map.addControl(nav, 'top-right');

        // Function to process data and update map (extracted from original map.on('load'))
        function processAndUpdateMapData(geojson, init = false) {
            let allVals = [];
            geojson.features.forEach(f => {
                const t = properties(f.properties, window.mode, window.weighted);
                if (Array.isArray(t)) {
                    t.forEach(val => {
                        if (typeof val === 'number') allVals.push(val);
                    });
                } else if (typeof t === 'number') {
                    allVals.push(t);
                }
            });

            allVals.sort((a, b) => a - b);
            console.log('Max value:', allVals[allVals.length - 1]);
            console.log('Min value:', allVals[0]);

            const quantiles = (arr, bins = binCount) => {
                const result = [];
                for (let i = 1; i < bins; i++) {
                    result.push(arr[Math.floor(arr.length * i / bins)]);
                }
                return result;
            };

            let combinedQuantiles, positiveQuantiles, negativeQuantiles;
            
            if (window.prognosis) {
                // Separate positive and negative values for prognosis mode
                const positiveVals = allVals.filter(v => v > 0).sort((a, b) => a - b);
                const negativeVals = allVals.filter(v => v < 0).sort((a, b) => a - b);
                const zeroVals = allVals.filter(v => v === 0);
                
                // Determine which range has higher max absolute value
                const maxPositive = positiveVals.length > 0 ? positiveVals[positiveVals.length - 1] : 0;
                const maxNegative = negativeVals.length > 0 ? Math.abs(negativeVals[0]) : 0;
                
                // Calculate 9 quantiles (8 breaks) and use only 1st, 3rd, 5th, 7th (indices 0, 2, 4, 6)
                // Use the range with higher max abs value for both directions (symmetric mapping)
                if (maxPositive >= maxNegative && positiveVals.length > 0) {
                    // Use positive quantiles for both directions
                    const allPositiveQuantiles = quantiles(positiveVals, 9);
                    positiveQuantiles = allPositiveQuantiles.length >= 7 ? 
                        [allPositiveQuantiles[0], allPositiveQuantiles[2], allPositiveQuantiles[4], allPositiveQuantiles[6]] : 
                        allPositiveQuantiles;
                    // Apply same thresholds with reversed signs for negative range
                    negativeQuantiles = positiveQuantiles.map(q => -q).reverse();
                } else if (negativeVals.length > 0) {
                    // Use negative quantiles for both directions
                    const allNegativeQuantiles = quantiles(negativeVals, 9);
                    negativeQuantiles = allNegativeQuantiles.length >= 7 ? 
                        [allNegativeQuantiles[0], allNegativeQuantiles[2], allNegativeQuantiles[4], allNegativeQuantiles[6]] : 
                        allNegativeQuantiles;
                    // Apply same thresholds with reversed signs for positive range
                    positiveQuantiles = negativeQuantiles.map(q => -q).reverse();
                }
                
                console.log('Positive values count:', positiveVals.length, 'range:', positiveVals[0], 'to', positiveVals[positiveVals.length - 1]);
                console.log('Negative values count:', negativeVals.length, 'range:', negativeVals[0], 'to', negativeVals[negativeVals.length - 1]);
                console.log('Zero values count:', zeroVals.length);
                console.log('Max absolute values - Positive:', maxPositive, 'Negative:', maxNegative);
                console.log('Using', maxPositive >= maxNegative ? 'positive' : 'negative', 'range for symmetric thresholds');
                console.log('Positive quantiles (increases):', positiveQuantiles);
                console.log('Negative quantiles (decreases):', negativeQuantiles);
            } else {
                combinedQuantiles = window.weighted ? quantiles(allVals) : prettyBreaks;
                console.log('Quantiles:', combinedQuantiles);
            }

            // For prognosis mode, use maximum absolute value for proper scaling
            const maxAbsValue = window.prognosis ? 
                Math.max(Math.abs(allVals[0]), Math.abs(allVals[allVals.length - 1])) :
                allVals[allVals.length - 1];
            const ef = extrusionFactor / maxAbsValue;

            const extrusions = [];
            geojson.features.forEach((f, i) => {
                const center = f.geometry.coordinates;
                const t = properties(f.properties, window.mode, window.weighted);

                // Always add the outer ring (base)
                extrusions.push({
                    type: 'Feature',
                    id: i * 2,
                    geometry: { type: 'Polygon', coordinates: [makeHexPolygon(center, 1)] },
                    properties: {
                        color: interpolateColor(t[0], combinedQuantiles, positiveQuantiles, negativeQuantiles),
                        baseHeight: 0,
                        targetHeight: Math.abs(t[0]) * ef
                    }
                });

                // Add inner ring for all modes, but with zero height except for nowMinMax (always visible in 2D, extruded in 3D)
                extrusions.push({
                    type: 'Feature',
                    id: i * 2 + 1,
                    geometry: { type: 'Polygon', coordinates: [makeHexPolygon(center, 0.5)] },
                    properties: {
                        color: interpolateColor(window.mode === 'nowMinMax' ? t[1] : t[0], combinedQuantiles, positiveQuantiles, negativeQuantiles),
                        baseHeight: 0,
                        targetHeight: window.mode === 'nowMinMax' ? Math.abs(t[1]) * ef : 0
                    }
                });
            });

            if (init) {
                // Add map source and layer
                map.addSource('cells', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features: extrusions }
                });

                const zoomAlpha0 = 0.5;
                const zoomAlphaZone = [12.25, 12.75];

                map.addLayer({
                    id: 'extruded-layer',
                    type: 'fill-extrusion',
                    source: 'cells',
                    paint: {
                        'fill-extrusion-color': ['get', 'color'],
                        // 'fill-extrusion-opacity': ['get', 'opacity'],
                        'fill-extrusion-opacity': [
                            'interpolate',
                            ['linear'],
                            ['zoom'],
                            zoomAlphaZone[0], zoomAlpha0,
                            zoomAlphaZone[1], 1
                        ],
                        'fill-extrusion-height': ['coalesce', ['feature-state', 'height'], 0],
                        'fill-extrusion-base': ['coalesce', ['get', 'baseHeight'], 0]
                    }
                });
            }
            else {
                // Store current heights before updating data
                const currentHeights = new Map();
                if (map.getSource('cells')) {
                    const source = map.getSource('cells');
                    const features = source._data.features;
                    features.forEach(f => {
                        const state = map.getFeatureState({ source: 'cells', id: f.id });
                        currentHeights.set(f.id, state.height || 0);
                    });
                }

                // Update map source
                map.getSource('cells').setData({ type: 'FeatureCollection', features: extrusions });

                // Check if we're switching between compatible modes
                const isCompatibleModeSwitch = window.lastMode && (
                    (window.lastMode === 'progNom10' && window.mode === 'progNom20') ||
                    (window.lastMode === 'progNom20' && window.mode === 'progNom10') ||
                    (window.lastMode === 'nowNom' && window.mode === 'nowMinMax') ||
                    (window.lastMode === 'nowMinMax' && window.mode === 'nowNom')
                );

                if (isCompatibleModeSwitch) {
                    // Preserve heights for compatible mode switches
                    extrusions.forEach(f => {
                        const preservedHeight = currentHeights.get(f.id) || 0;
                        map.setFeatureState({ source: 'cells', id: f.id }, { height: preservedHeight });
                    });
                } else {
                    // Reset feature states for other changes
                    extrusions.forEach(f =>
                        map.setFeatureState({ source: 'cells', id: f.id }, { height: 0 })
                    );
                }
            }

            // Store current mode for next comparison
            window.lastMode = window.mode;

            // Animate extrusions to target heights if in 3D mode
            if (mapState === MapState.in3D) {
                setTimeout(() => {
                    animateExtrusion(true, 300);
                }, 100);
            }
        }

        const interpolateColor = (value, thresholds, positiveThresholds, negativeThresholds) => {
            let colorMin, colorMax;
            let useThresholds = thresholds;
            
            if (window.prognosis) {
                // Zero values should always be white (no change)
                if (value === 0) {
                    return 'rgb(255, 255, 255)';
                }
                
                if (value > 0) {
                    colorMin = [255, 255, 255];
                    colorMax = [218, 85, 80];
                    // Use separate positive quantiles if available
                    if (positiveThresholds && positiveThresholds.length > 0) {
                        useThresholds = positiveThresholds;
                        
                        // Handle values below the minimum threshold
                        if (value < useThresholds[0]) {
                            // Interpolate between white and color at first threshold
                            const t = value / useThresholds[0];
                            const r = Math.round((1 - t) * colorMin[0] + t * colorMax[0]);
                            const g = Math.round((1 - t) * colorMin[1] + t * colorMax[1]);
                            const b = Math.round((1 - t) * colorMin[2] + t * colorMax[2]);
                            return `rgb(${r}, ${g}, ${b})`;
                        }
                        
                        // Interpolate between thresholds
                        for (let i = 0; i < useThresholds.length - 1; i++) {
                            if (value <= useThresholds[i + 1]) {
                                // Value is between useThresholds[i] and useThresholds[i+1]
                                const segmentT = (value - useThresholds[i]) / (useThresholds[i + 1] - useThresholds[i]);
                                const overallT = (i + 1 + segmentT) / useThresholds.length;
                                const r = Math.round((1 - overallT) * colorMin[0] + overallT * colorMax[0]);
                                const g = Math.round((1 - overallT) * colorMin[1] + overallT * colorMax[1]);
                                const b = Math.round((1 - overallT) * colorMin[2] + overallT * colorMax[2]);
                                return `rgb(${r}, ${g}, ${b})`;
                            }
                        }
                        // Value is above the highest threshold
                        return `rgb(${colorMax[0]}, ${colorMax[1]}, ${colorMax[2]})`;
                    }
                }
                else {
                    colorMin = [255, 255, 255];
                    colorMax = [50, 165, 202];
                    // Use separate negative quantiles if available, and work with absolute values
                    if (negativeThresholds && negativeThresholds.length > 0) {
                        useThresholds = negativeThresholds.map(v => Math.abs(v));
                        const absValue = Math.abs(value);
                        
                        // Handle values below the minimum threshold
                        if (absValue < useThresholds[0]) {
                            // Interpolate between white and color at first threshold
                            const t = absValue / useThresholds[0];
                            const r = Math.round((1 - t) * colorMin[0] + t * colorMax[0]);
                            const g = Math.round((1 - t) * colorMin[1] + t * colorMax[1]);
                            const b = Math.round((1 - t) * colorMin[2] + t * colorMax[2]);
                            return `rgb(${r}, ${g}, ${b})`;
                        }
                        
                        // Interpolate between thresholds
                        for (let i = 0; i < useThresholds.length - 1; i++) {
                            if (absValue <= useThresholds[i + 1]) {
                                // Value is between useThresholds[i] and useThresholds[i+1]
                                const segmentT = (absValue - useThresholds[i]) / (useThresholds[i + 1] - useThresholds[i]);
                                const overallT = (i + 1 + segmentT) / useThresholds.length;
                                const r = Math.round((1 - overallT) * colorMin[0] + overallT * colorMax[0]);
                                const g = Math.round((1 - overallT) * colorMin[1] + overallT * colorMax[1]);
                                const b = Math.round((1 - overallT) * colorMin[2] + overallT * colorMax[2]);
                                return `rgb(${r}, ${g}, ${b})`;
                            }
                        }
                        // Value is above the highest threshold
                        return `rgb(${colorMax[0]}, ${colorMax[1]}, ${colorMax[2]})`;
                    }
                }
            }
            else {
                colorMin = [50, 165, 202];
                colorMax = [218, 85, 80];
            }

            // Standard threshold-based interpolation
            // Handle values below the minimum threshold
            if (value < useThresholds[0]) {
                const t = value / useThresholds[0];
                const r = Math.round((1 - t) * colorMin[0] + t * colorMax[0]);
                const g = Math.round((1 - t) * colorMin[1] + t * colorMax[1]);
                const b = Math.round((1 - t) * colorMin[2] + t * colorMax[2]);
                return `rgb(${r}, ${g}, ${b})`;
            }
            
            // Interpolate between thresholds
            for (let i = 0; i < useThresholds.length - 1; i++) {
                if (value <= useThresholds[i + 1]) {
                    // Value is between useThresholds[i] and useThresholds[i+1]
                    const segmentT = (value - useThresholds[i]) / (useThresholds[i + 1] - useThresholds[i]);
                    const overallT = (i + 1 + segmentT) / useThresholds.length;
                    const r = Math.round((1 - overallT) * colorMin[0] + overallT * colorMax[0]);
                    const g = Math.round((1 - overallT) * colorMin[1] + overallT * colorMax[1]);
                    const b = Math.round((1 - overallT) * colorMin[2] + overallT * colorMax[2]);
                    return `rgb(${r}, ${g}, ${b})`;
                }
            }
            // Value is above the highest threshold
            return `rgb(${colorMax[0]}, ${colorMax[1]}, ${colorMax[2]})`;
        };

        const makeHexPolygon = ([centerLon, centerLat], scale = 1) => {
            const points = [];
            const verticesCount = window.prognosis ? verticesCountPrognosis : verticesCountNow;
            for (let i = 0.5; i < verticesCount; i++) {
                const angle = (i / verticesCount) * 2 * Math.PI;
                const dLat = latRadiusInDegrees * scale * Math.sin(angle);
                const dLon = lonRadiusInDegrees * scale * Math.cos(angle);
                points.push([centerLon + dLon, centerLat + dLat]);
            }
            points.push(points[0]);
            return points;
        };

        const properties = (prop, mode, weighted = false) => {
            switch (mode) {
                case 'nowNom':
                    return weighted ?
                        [prop.EwM_22_Nom_100pctDocs] :
                        [prop.tNom_100pctDocs];
                case 'nowMinMax':
                    return weighted ?
                        [prop.EwM_22_Min_100pctDocs, prop.EwM_22_Max_100pctDocs] :
                        [prop.tMin_100pctDocs, prop.tMax_100pctDocs];
                case 'progNom10':
                    return weighted ?
                        [prop.EwM_40_Nom_090pctDocs - prop.EwM_22_Nom_100pctDocs] :
                        [prop.tNom_090pctDocs - prop.tNom_100pctDocs];
                case 'progNom20':
                    return weighted ?
                        // [prop.EwM_22_Nom_100pctDocs * (1 + prop.EwM_22_40_Nom_080pctDocs_diff/100)] : 
                        [prop.EwM_40_Nom_080pctDocs - prop.EwM_22_Nom_100pctDocs] :
                        [prop.tNom_080pctDocs - prop.tNom_100pctDocs];
                default:
                    return [];
            }
        };

        map.on('load', () => {
            map.setLight({
                anchor: 'viewport',
                color: '#ffffff',
                intensity: 0.5
            });

            fetch(dataPath)
                .then(res => res.json())
                .then(geojson => processAndUpdateMapData(geojson, true));
        });

        map.on('pitchend', () => {
            const pitch = map.getPitch();
            if (mapState !== MapState.animating) {
                if (pitch === 0 && mapState !== MapState.in2D) animateExtrusion(false);
                else if (pitch > 0 && mapState !== MapState.in3D) animateExtrusion(true);
            }
        });

        function animateExtrusion(to3D = false, duration = 500) {
            const source = map.getSource('cells');
            const features = source._data.features;
            const start = performance.now();

            // Store current heights at the start of animation
            const startHeights = new Map();
            features.forEach(f => {
                const state = map.getFeatureState({ source: 'cells', id: f.id });
                startHeights.set(f.id, state.height || 0);
            });

            function frame(now) {
                const t = Math.min((now - start) / duration, 1);
                const eased = t * t * (3 - 2 * t);

                for (const f of features) {
                    const startHeight = startHeights.get(f.id) || 0;
                    const targetHeight = to3D ? f.properties.targetHeight : 0;
                    const newHeight = startHeight + (targetHeight - startHeight) * eased;
                    map.setFeatureState({ source: 'cells', id: f.id }, { height: newHeight });
                }

                if (t < 1) requestAnimationFrame(frame);
                else {
                    mapState = to3D ? MapState.in3D : MapState.in2D;
                    setButtonText(to3D ? '2D' : '3D');
                }
            }

            requestAnimationFrame(frame);
        }

        function animateMapPitch(to3D = false, duration = 1500) {
            const start = performance.now();
            const pitchStart = map.getPitch();
            const pitchEnd = to3D ? 60 : 0;

            function frame(now) {
                const t = Math.min((now - start) / duration, 1);
                const eased = t * t * (3 - 2 * t);
                map.setPitch(pitchStart + (pitchEnd - pitchStart) * eased);

                if (t < 1) requestAnimationFrame(frame);
                else animateExtrusion(to3D);
            }

            mapState = MapState.animating;
            requestAnimationFrame(frame);
        }

        function pitchButtonPressed() {
            setButtonText('…');
            animateMapPitch(map.getPitch() === 0);
        }

        function setButtonText(text = '3D') {
            document.querySelector('#pitchButton').innerHTML = text;
        }
    </script>
</body>
